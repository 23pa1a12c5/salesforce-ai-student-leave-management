<template>
    <lightning-card title="Student Leave Request" icon-name="standard:work_order">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Student Name"
                value={studentName}
                onchange={handleStudentName}>
            </lightning-input>

            <lightning-input
                label="Student ID"
                value={studentId}
                onchange={handleStudentId}>
            </lightning-input>

            <lightning-input
                type="email"
                label="Email"
                value={email}
                onchange={handleEmail}>
            </lightning-input>

            <lightning-combobox
                label="Department"
                value={department}
                options={departmentOptions}
                onchange={handleDepartment}>
            </lightning-combobox>

            <lightning-combobox
                label="Year"
                value={year}
                options={yearOptions}
                onchange={handleYear}>
            </lightning-combobox>

            <lightning-input
                type="date"
                label="Leave From"
                value={leaveFrom}
                onchange={handleLeaveFrom}>
            </lightning-input>

            <lightning-input
                type="date"
                label="Leave To"
                value={leaveTo}
                onchange={handleLeaveTo}>
            </lightning-input>

            <lightning-textarea
                label="Reason"
                value={reason}
                onchange={handleReason}>
            </lightning-textarea>

            <br/>

            <lightning-button
                variant="brand"
                label="Submit Leave Request"
                onclick={submitLeave}>
            </lightning-button>

        </div>

    </lightning-card>
</template>
